<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Viewport Height Reminder</title>
		<style>
			body {
				margin: 0;
			}

			.container {
				display: flex;
				gap: 2px;
				position: fixed;
				top: 0;
			}

			.line {
				position: relative;
				top: 0;
				padding: 4px;
				box-sizing: border-box;
				flex: 1;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.line::before,
			.line::after {
				content: '';
				width: 100%;
				height: 3px;
				left: 0;
				background: black;
				position: absolute;
			}
			.line::before {
				top: 0;
			}
			.line::after {
				bottom: 0;
			}

			.vh {
				height: 100vh;
			}
			.dvh {
				height: 100dvh;
			}
			.svh {
				height: 100svh;
			}
			.lvh {
				height: 100lvh;
			}
			.abs {
				position: absolute;
				top: 0;
				bottom: 0;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="line vh" style="background: #ff000020">vh</div>
			<div class="line dvh" style="background: #00ff0020">dvh</div>
			<div class="line svh" style="background: #0000ff20">svh</div>
			<div class="line lvh" style="background: #9f009f20">lvh</div>
			<div class="line abs" style="background: #ffff0020">abs</div>
		</div>

		<div style="height: 200vh"></div>

		<div
			style="
				position: fixed;
				top: 8px;
				right: 8px;
				background: black;
				border-radius: 8px;
				padding: 8px;
				color: white;
				max-width: 50vw;
				display: flex;
				flex-direction: column;
				gap: 4px;
			"
		>
			I am always forgetting what these are.
			<input placeholder="keyboard test" />
		</div>
	</body>
</html>
